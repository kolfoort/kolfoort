<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Kolfoort Automotive Studio</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    body {
      min-height: 100svh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      width: 100%;
      height: 100svh;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .art {
      position: relative;
      width: min(100vw, 1536px);
      aspect-ratio: 1536 / 1024;
      background: url("kolfoort-template.png") center center / contain no-repeat;
      flex: 0 1 auto;
    }
    .email-link {
      position: absolute;
      left: 36%;
      top: 72%;
      width: 29%;
      height: 12%;
      display: block;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="art" role="img" aria-label="Kolfoort Automotive Studio">
      <a class="email-link" href="mailto:info@kolfoort.com" aria-label="E-mail Kolfoort"></a>
    </div>
  </main>
</body>
</html>
