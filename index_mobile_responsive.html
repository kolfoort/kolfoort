<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Kolfoort Automotive Studio</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#000}
    body{min-height:100svh;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
    .page{width:100%;height:100svh;min-height:500px;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
    .art{position:relative;width:min(100vw,1536px);aspect-ratio:1536/1024;background:url("kolfoort-template.png") center center/contain no-repeat;flex:0 1 auto}

    /* Replaces the email area in the original artwork */
    .contact{
      position:absolute;
      left:29%;
      top:66%;
      width:42%;
      min-height:25%;
      padding:15px 20px 12px;
      background:rgba(0,0,0,.93);
      box-shadow:0 8px 30px rgba(0,0,0,.45);
    }
    .contact-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .field{min-width:0}
    .field.message{margin-top:11px}
    .field label{display:block;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:5px}
    input,textarea{
      width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.42);
      background:transparent;color:#fff;padding:5px 0 7px;outline:none;
      font:12px Arial,Helvetica,sans-serif;border-radius:0
    }
    textarea{height:34px;resize:none}
    input:focus,textarea:focus{border-bottom-color:#ff7200}
    .actions{display:flex;align-items:center;justify-content:flex-end;margin-top:10px}
    button{
      border:1px solid #ff7200;background:#ff7200;color:#080808;
      padding:8px 16px;font-size:8px;font-weight:bold;letter-spacing:2px;
      cursor:pointer
    }
    button:hover{background:#fff;border-color:#fff}
    .privacy{font-size:7px;color:#777;margin-right:auto}

    @media(max-width:700px){
      /* Mobile: show the complete artwork instead of cropping it */
      html,body{width:100%;min-width:0;overflow-x:hidden}
      body{overflow-y:auto}
      .page{
        width:100%;
        height:auto;
        min-height:100svh;
        display:block;
        overflow:hidden;
      }
      .art{
        width:100vw;
        height:calc(66.6667vw + 245px);
        min-height:0;
        aspect-ratio:auto;
        background-size:100vw auto;
        background-position:center top;
        background-repeat:no-repeat;
      }
      .contact{
        left:8%;
        top:calc(66.6667vw + 8px);
        width:84%;
        min-height:0;
        padding:13px 15px 12px;
        background:rgba(0,0,0,.94);
        box-shadow:none;
      }
      .contact-grid{grid-template-columns:1fr;gap:7px}
      .field.message{margin-top:6px}
      .field label{font-size:8px;letter-spacing:1.7px;margin-bottom:4px}
      input,textarea{font-size:12px;padding:4px 0 6px}
      textarea{height:42px}
      .actions{margin-top:9px}
      button{padding:8px 14px;font-size:8px}
      .privacy{display:none}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="art" role="img" aria-label="Kolfoort Automotive Studio">

      <form class="contact"
            action="https://formsubmit.co/info@kolfoort.com"
            method="POST">

        <input type="hidden" name="_subject" value="Nieuw contact via Kolfoort Automotive Studio">
        <input type="hidden" name="_next" value="https://kolfoort.github.io/kolfoort/">
        <input type="hidden" name="_captcha" value="false">

        <div class="contact-grid">
          <div class="field">
            <label for="name">Naam</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="phone">Telefoon</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel">
          </div>
        </div>

        <div class="field message">
          <label for="message">Bericht</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <div class="actions">
          <span class="privacy">We gebruiken je gegevens alleen om contact op te nemen.</span>
          <button type="submit">VERSTUREN&nbsp; →</button>
        </div>
      </form>

    </div>
  </main>
</body>
</html>
